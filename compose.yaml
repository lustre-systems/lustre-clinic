# The clinic machine runs this file twice, as two projects with their own
# volumes, networks and passwords (infra/README.md):
#
#   docker compose -p lustre-prod --env-file .env.prod up -d
#   docker compose -p lustre-dev  --env-file .env.dev  up -d
#
# Neither can reach the other's database: each project gets its own network.
# A developer's laptop still runs `docker compose up -d db` with `.env`.
services:
    db:
        image: postgres:17-alpine
        restart: always
        environment:
            POSTGRES_USER: lustre
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
            POSTGRES_DB: lustre
            # Read once, when the volume is created, by
            # infra/postgres/init/10-roles.sh. Unset on a laptop, which keeps
            # the single superuser.
            LUSTRE_OWNER_PASSWORD: ${LUSTRE_OWNER_PASSWORD:-}
            LUSTRE_APP_PASSWORD: ${LUSTRE_APP_PASSWORD:-}
            LUSTRE_ENVIRONMENT: ${LUSTRE_ENVIRONMENT:-development}
        # Sized for the 4 GB clinic laptop, which also runs the API and the
        # GlitchTip stack. Postgres' own defaults assume it has the machine; the
        # cap stops a runaway query from pushing everything else into swap.
        command:
            - postgres
            - -c
            - shared_buffers=256MB
            - -c
            - effective_cache_size=768MB
            - -c
            - work_mem=8MB
            - -c
            - maintenance_work_mem=64MB
            - -c
            - max_connections=40
        mem_limit: 1g
        cpus: 2
        # Docker's 64 MB default /dev/shm is too small for parallel queries.
        shm_size: 256m
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U lustre -d lustre']
            interval: 5s
            timeout: 5s
            retries: 10
        # Loopback only. The server container reaches it over the compose
        # network; this mapping exists so migrations, tests, and psql can run
        # from the host. Nothing outside the machine can connect. DB_PORT keeps
        # the dev stack's copy off production's port.
        ports:
            - '127.0.0.1:${DB_PORT:-5432}:5432'

    server:
        # The compiled binary plus pg_dump (Dockerfile). Run `bun run
        # build:server` first; the build context is `dist/` alone
        # (.dockerignore). The target is Bun's baseline build because the first
        # clinic laptop's Sandy Bridge CPU has no AVX2.
        build: .
        restart: always
        working_dir: /app
        # The image's ENTRYPOINT is the binary, so a subcommand runs against the
        # live stack: `docker compose run --rm server backup`.
        environment:
            NODE_ENV: production
            # The row-level role: no DROP, TRUNCATE or ALTER (10-roles.sh).
            DATABASE_URL: postgres://lustre_app:${LUSTRE_APP_PASSWORD:-}@db:5432/lustre
            # Empty in .env.prod, so the production server never holds the
            # owner's password; the deploy migrates with a one-off
            # `docker compose run`. The dev stack sets it and migrates on boot.
            MIGRATION_DATABASE_URL: ${SERVER_MIGRATION_DATABASE_URL:-}
            MIGRATE_ON_BOOT: ${MIGRATE_ON_BOOT:-false}
            PORT: 3000
            LOG_LEVEL: ${LOG_LEVEL:-info}
            TAILSCALE_IP: ${TAILSCALE_IP:-}
            TAILSCALE_HOSTNAME: ${TAILSCALE_HOSTNAME:-}
            DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
            HEARTBEAT_URL: ${HEARTBEAT_URL:-}
            BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
            BACKUP_DIR: /app/backups
            BACKUP_DRIVE_FOLDER_ID: ${BACKUP_DRIVE_FOLDER_ID:-}
            BACKUP_DRIVE_OAUTH_CLIENT_ID: ${BACKUP_DRIVE_OAUTH_CLIENT_ID:-}
            BACKUP_DRIVE_OAUTH_CLIENT_SECRET: ${BACKUP_DRIVE_OAUTH_CLIENT_SECRET:-}
            BACKUP_DRIVE_REFRESH_TOKEN: ${BACKUP_DRIVE_REFRESH_TOKEN:-}
            BACKUP_DRIVE_ANDROID_CLIENT_ID: ${BACKUP_DRIVE_ANDROID_CLIENT_ID:-}
            BACKUP_DRIVE_ANDROID_REDIRECT_URI: ${BACKUP_DRIVE_ANDROID_REDIRECT_URI:-}
            BACKUP_DRIVE_CLIENT_EMAIL: ${BACKUP_DRIVE_CLIENT_EMAIL:-}
            BACKUP_DRIVE_PRIVATE_KEY: ${BACKUP_DRIVE_PRIVATE_KEY:-}
            BACKUP_DRIVE_SUBJECT: ${BACKUP_DRIVE_SUBJECT:-}
            BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
            BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
            BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
            BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
            BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
            # The APK and OTA updates, copied in by scripts/pushReleases.ts (§15).
            RELEASES_DIR: /app/releases
            UPDATES_CHANNEL: ${LUSTRE_ENVIRONMENT:-development}
            # Reported by health.check; a dev build refuses anything but
            # development. Production unless the stack says otherwise.
            SERVER_ENVIRONMENT: ${LUSTRE_ENVIRONMENT:-production}
        volumes:
            - ./backups:/app/backups
            - ./releases:/app/releases:ro
        # Bound to the Tailscale interface only — Tailscale is the security
        # boundary (SPEC §1). Set TAILSCALE_IP in .env. API_PORT is 3000 for
        # production and 3001 for the dev stack.
        ports:
            - '${TAILSCALE_IP:?set TAILSCALE_IP in .env (0.0.0.0 only on a laptop)}:${API_PORT:-3000}:3000'
        depends_on:
            db:
                condition: service_healthy

    # --- GlitchTip (§17) -----------------------------------------------------
    # Crash reports are disposable and self-pruning, so they get their own
    # Postgres rather than a second database on `db`: §16's pg_dump then covers
    # the whole `db` container without ever touching them, and a retention purge
    # churning event rows cannot bloat the volume the clinic's data lives on.
    #
    # Behind the `glitchtip` profile: production turns it on with
    # COMPOSE_PROFILES=glitchtip in .env.prod, and the dev stack, which reports
    # nowhere, leaves it off.
    glitchtip-db:
        image: postgres:17-alpine
        profiles: [glitchtip]
        restart: always
        environment:
            POSTGRES_USER: glitchtip
            POSTGRES_PASSWORD: ${GLITCHTIP_POSTGRES_PASSWORD:?set GLITCHTIP_POSTGRES_PASSWORD in .env}
            POSTGRES_DB: glitchtip
        volumes:
            - glitchtip-pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U glitchtip -d glitchtip']
            interval: 5s
            timeout: 5s
            retries: 10
        # Not published. Only the GlitchTip containers ever talk to it.

    glitchtip-redis:
        image: redis:7-alpine
        profiles: [glitchtip]
        restart: always
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    glitchtip-web:
        image: glitchtip/glitchtip:v4.2.2
        profiles: [glitchtip]
        restart: always
        environment: &glitchtip-env
            DATABASE_URL: postgres://glitchtip:${GLITCHTIP_POSTGRES_PASSWORD}@glitchtip-db:5432/glitchtip
            REDIS_URL: redis://glitchtip-redis:6379/0
            SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set GLITCHTIP_SECRET_KEY in .env}
            # MagicDNS hostname — the DSN is baked into release builds and has
            # to resolve from anywhere on the tailnet (§17).
            GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:?set GLITCHTIP_DOMAIN in .env}
            # Retention. Celery beat purges events older than this nightly, so
            # the worker below is what actually enforces it.
            GLITCHTIP_MAX_EVENT_LIFE_DAYS: ${GLITCHTIP_MAX_EVENT_LIFE_DAYS:-90}
            # No mail server exists: unset, Django dials SMTP on localhost and
            # signup and password reset answer 500. Mail goes to the container
            # log instead (`docker compose logs glitchtip-web` for a reset link),
            # and crash alerts go to Discord through GlitchTip's own webhook.
            EMAIL_URL: consolemail://
            # Off once the first account exists (§17). Two separate gates in
            # v4.2.2: ENABLE_USER_REGISTRATION is the signup gate (and defaults
            # True, so leaving it unset lets any tailnet device self-register),
            # while ENABLE_OPEN_USER_REGISTRATION only feeds org creation.
            # Signup is permitted regardless while there are no users at all,
            # so the first account can still be made with both off.
            ENABLE_USER_REGISTRATION: ${GLITCHTIP_OPEN_REGISTRATION:-False}
            ENABLE_OPEN_USER_REGISTRATION: ${GLITCHTIP_OPEN_REGISTRATION:-False}
        volumes:
            - glitchtip-uploads:/code/uploads
        # Tailscale interface only, like the API. The image binds :8080.
        ports:
            - '${TAILSCALE_IP:?set TAILSCALE_IP in .env (0.0.0.0 only on a laptop)}:8000:8080'
        depends_on:
            glitchtip-db:
                condition: service_healthy
            glitchtip-redis:
                condition: service_healthy
            # Without this a bare `up -d` serves 500s against an empty schema,
            # and uvicorn staying up means `restart: always` never recycles it.
            glitchtip-migrate:
                condition: service_completed_successfully

    # Runs the retention purge and the event-ingest queue. Without beat, events
    # accumulate forever regardless of GLITCHTIP_MAX_EVENT_LIFE_DAYS.
    glitchtip-worker:
        image: glitchtip/glitchtip:v4.2.2
        profiles: [glitchtip]
        restart: always
        command: ./bin/run-celery-with-beat.sh
        environment: *glitchtip-env
        volumes:
            - glitchtip-uploads:/code/uploads
        depends_on:
            glitchtip-db:
                condition: service_healthy
            glitchtip-redis:
                condition: service_healthy
            glitchtip-migrate:
                condition: service_completed_successfully

    glitchtip-migrate:
        image: glitchtip/glitchtip:v4.2.2
        profiles: [glitchtip]
        restart: 'no'
        command: ./bin/run-migrate.sh
        environment: *glitchtip-env
        depends_on:
            glitchtip-db:
                condition: service_healthy

volumes:
    pgdata:
    glitchtip-pgdata:
    glitchtip-uploads:
