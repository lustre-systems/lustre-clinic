# Release artefacts for one stack (`stack`): the APK Settings offers and the OTA
# updates release builds fetch, staged in dist/releases (prod) or
# dist/releases-dev (dev) by `bun ship` (infra/README.md, "Releases"). The
# server reads them on each request, so nothing restarts.
#
# `bun ship` sends them itself after the server is up; this is the same
# script, for `bun play releases` and a fresh machine. It sends one compressed
# stream of what the server lacks, lands it beside the releases, and renames
# it into place pointers last, so a phone never sees a pointer to files still
# landing (scripts/pushReleases.ts). Additive on purpose: an update a phone may
# still be downloading is never deleted from under it.

- name: "{{ stack.name }}: releases directory"
  ansible.builtin.file:
    path: /opt/lustre-{{ stack.name }}/releases
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: "{{ stack.name }}: copy releases"
  become: false
  delegate_to: localhost
  ansible.builtin.command:
    argv:
      - bun
      - scripts/pushReleases.ts
      - "--stack={{ stack.name }}"
      - "--host={{ hostvars[inventory_hostname].ansible_user }}@{{ hostvars[inventory_hostname].ansible_host }}"
    chdir: "{{ repo_root }}"
  register: stack_releases
  changed_when: "'Sent ' in stack_releases.stdout"
